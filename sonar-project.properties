# Configuración del análisis de SonarQube Cloud.
# La organización y la clave del proyecto se envían desde el pipeline con las
# variables del repositorio SONAR_ORGANIZATION y SONAR_PROJECT_KEY.
sonar.projectName=Modulo de Inventario - Equipo 6
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Código a analizar (incluye los workflows de GitHub Actions) y pruebas
sonar.sources=src,public,scripts,.github
sonar.tests=tests
# docs/evidencias guarda reportes y capturas generados por otras herramientas (ZAP, pruebas); no es código del módulo
sonar.exclusions=coverage/**,dist/**,reports/**,data/**,docs/evidencias/**

# Cobertura generada por "npm test" (formato LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Sin pruebas unitarias: punto de arranque, página web (se prueba a mano) y script de build
sonar.coverage.exclusions=src/server.js,public/**,scripts/**
