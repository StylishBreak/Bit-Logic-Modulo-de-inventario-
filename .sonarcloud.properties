# Configuración para el análisis automático de SonarQube Cloud (Automatic Analysis).
# Si el análisis lo hace el pipeline (recomendado, porque así se importa la cobertura),
# se usa sonar-project.properties.
sonar.sources=src,public,scripts,.github
sonar.tests=tests
# Reportes y capturas generados por otras herramientas: no son código del módulo
sonar.exclusions=coverage/**,dist/**,reports/**,data/**,docs/evidencias/**
