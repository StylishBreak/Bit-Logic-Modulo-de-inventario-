name: CI/CD Módulo de Inventario

# 1) CÓDIGO: el pipeline se activa solo con cada push o pull request a main
#    (y se puede lanzar a mano desde la pestaña Actions)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2) PRUEBAS: pruebas unitarias y de API con cobertura + análisis de calidad (SonarQube Cloud)
  pruebas:
    name: Pruebas y calidad
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo para SonarQube

      - name: Preparar Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Instalar (el proyecto no tiene dependencias externas)
        run: npm ci --ignore-scripts

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Ejecutar pruebas con cobertura (falla si la cobertura baja del mínimo)
        run: npm test

      - name: Guardar resultados de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pruebas-y-cobertura
          path: |
            coverage/lcov.info
            reports/junit.xml

      - name: Análisis de calidad con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # 3) BUILD: revisa sintaxis y SQL, genera dist/ y prueba que el paquete arranque
  build:
    name: Build
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Construir el paquete
        run: npm run build

      - name: Prueba de humo del paquete construido
        working-directory: dist
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export DB_PATH="$RUNNER_TEMP/inventario.db"
          node --disable-warning=ExperimentalWarning src/server.js &
          sleep 2
          curl --fail --silent http://localhost:3000/health
          echo
          curl --fail --silent --output /dev/null http://localhost:3000/
          codigo=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:3000/api/inventario)
          test "$codigo" = "401" && echo "✔ La API rechaza peticiones sin token (401)"

      - name: Guardar el paquete construido
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: modulo-inventario-dist
          path: dist/

  # 4) DESPLIEGUE: solo en push a main; publica en Render el commit que pasó pruebas y build
  despliegue:
    name: Despliegue en Render
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.APP_URL }}
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      APP_URL: ${{ vars.APP_URL }}
    outputs:
      configurado: ${{ steps.configuracion.outputs.configurado }}
    steps:
      - name: Revisar configuración de Render
        id: configuracion
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ] || [ -z "$APP_URL" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Se omite Render: configura RENDER_DEPLOY_HOOK y APP_URL para habilitar despliegue y ZAP."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar el despliegue del commit probado
        if: steps.configuracion.outputs.configurado == 'true'
        run: curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"

      - name: Verificar que la nueva versión responde
        if: steps.configuracion.outputs.configurado == 'true'
        run: |
          for intento in $(seq 1 40); do
            version=$(curl --silent --max-time 20 "$APP_URL/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ ${#version} -ge 7 ] && [ "${GITHUB_SHA#"$version"}" != "$GITHUB_SHA" ]; then
              echo "✔ Versión $version desplegada y respondiendo en $APP_URL"
              exit 0
            fi
            echo "Intento $intento: versión publicada '${version:-sin respuesta}', esperando..."
            sleep 15
          done
          echo "::error::La nueva versión no respondió a tiempo"
          exit 1

  # 5) SEGURIDAD: escaneo base de OWASP ZAP sobre la versión publicada
  seguridad:
    name: Seguridad (OWASP ZAP)
    needs: despliegue
    if: needs.despliegue.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escaneo base de OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.APP_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: false
          artifact_name: reporte-zap
